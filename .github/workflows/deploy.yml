name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install MkDocs Material
        run: pip install mkdocs-material

      - name: Prepare docs directory
        run: |
          mkdir -p _build/docs
          rsync -a \
            --exclude '.git' --exclude '.github' --exclude '_build' \
            --exclude 'site' --exclude 'tmp' --exclude 'index.html' \
            --exclude '*.py' \
            ./ _build/docs/
          cp mkdocs.yml _build/

      - name: Build site
        run: cd _build && mkdocs build -d ../site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

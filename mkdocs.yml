site_name: CS101 知识库
site_description: CS101 文档与知识库
site_url: https://itcs101.github.io/CS101/
repo_url: https://github.com/itcs101/CS101

# 文档目录
docs_dir: docs

theme:
  name: material
  language: zh
  icon:
    logo: material/school
  palette:
    # 浅色模式
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    # 深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
  font:
    text: Noto Sans SC
    code: JetBrains Mono
  features:
    - navigation.sections        # 顶级导航显示为分组
    - navigation.indexes         # 目录 index.md 作为分组标题页
    - navigation.expand          # 默认展开所有分组，保留层次
    - navigation.instant         # 无刷新切换，更快
    - navigation.top             # 返回顶部按钮
    - navigation.tracking        # URL 跟随滚动位置
    - search.highlight           # 搜索结果高亮
    - search.suggest             # 搜索建议
    - content.code.copy          # 代码块一键复制
    - content.action.edit        # 页面上的"编辑此页"按钮

extra_css:
  - stylesheets/custom.css

# 网站页脚与额外信息
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/itcs101
      name: GitHub 组织

plugins:
  - search:
      lang: zh

markdown_extensions:
  - admonition
  - tables
  - fenced_code
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

# 排除非文档内容
exclude_docs: |
  .git/
  .github/
  site/
  tmp/
  *.py
  *.docx
  *.pdf
  index.html

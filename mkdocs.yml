site_name: CS101 知识库
site_description: CS101 文档与知识库
site_url: https://itcs101.github.io/CS101/
repo_url: https://github.com/itcs101/CS101

# 文档目录
docs_dir: docs

theme:
  name: material
  language: zh
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  features:
    - navigation.sections
    - navigation.top
    - search.highlight

plugins:
  - search:
      lang: zh

markdown_extensions:
  - admonition
  - tables
  - fenced_code
  - toc:
      permalink: true

# 排除非文档内容
exclude_docs: |
  .git/
  .github/
  site/
  tmp/
  *.py
  *.docx
  *.pdf
  index.html

nav:
  - 首页: index.md
  - CS101:
    - 课程笔记: cs101/cs101.md
    - VSCode AI 开发: cs101/vscode-ai-dev.md
  - AI:
    - LLM 入门: ai/LLM/LLM101.md
    - AI 工程化: ai/ai-engineering/speckit-openspec-superpowers.md
    - 知识图谱: ai/knowledgeGraph/bomis.md
    - 知识图谱本体: ai/knowledgeGraph/bomis_ontology.md
    - AI 工具: ai/AI-Tools/ai-tools.md
    - OpenClaw: ai/AI-Tools/openclaw.md
    - OpenSec: ai/AI-Tools/opensec.md
    - GitHub Agent 101: ai/agent101/github-agent101.md
  - 业务分析:
    - AI 时代的业务分析: business-analysis/ba-ai.md
    - UBO 监管: business-analysis/uboreg.md
    - XP 极限编程: business-analysis/asset/docs/xp.md
  - 业务建模:
    - BPMN 符号: business-modelling/bpmn/bpmn-symbols/bpmn_symbols.md
    - BPMN 说明: business-modelling/bpmn/bpmn_readme.md
    - 本体 - Palantir: business-modelling/ontology/palantir.md
    - 本体 - 合同管理: business-modelling/ontology/contractManagement.md
    - 本体 - 推理引擎: business-modelling/ontology/inferenceEngine.md
    - 本体 - OWL 入门: business-modelling/ontology/owlGetstarted.md
    - 本体 - ClearChoice: business-modelling/ontology/clearchoice.md
  - 银行:
    - 银行运营: banking/bankops/bankops.md
    - NPDD 示例: banking/npdd-sample.md
  - 写作:
    - Markdown 技巧: write-docs/wd-markdown.md

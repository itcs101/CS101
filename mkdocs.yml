site_name: CS101 知识库
site_description: CS101 文档与知识库
site_url: https://itcs101.github.io/CS101/
repo_url: https://github.com/itcs101/CS101

# 直接使用仓库根目录作为文档目录
docs_dir: .

theme:
  name: material
  language: zh
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  features:
    - navigation.sections
    - navigation.top
    - search.highlight

plugins:
  - search:
      lang: zh

markdown_extensions:
  - admonition
  - tables
  - fenced_code
  - toc:
      permalink: true

# 排除非文档内容
exclude_docs: |
  .git/
  .github/
  site/
  tmp/
  *.py
  *.docx
  *.pdf
  index.html

nav:
  - 首页: README.md
  - AI:
    - LLM 入门: AI/LLM/LLM101.md
    - AI 工程化: AI/ai-engineering/speckit-openspec-superpowers.md
    - 知识图谱: AI/knowledgeGraph/bomis.md
    - 知识图谱本体: AI/knowledgeGraph/bomis_ontology.md
    - AI 工具 - OpenClaw: AI/AI-Tools/openclaw.md
    - AI 工具 - VSCode AI 开发: AI/AI-Tools/vscode-ai-dev.md
  - 业务分析:
    - AI 时代的业务分析: business-analysis/ba-ai.md
    - UBO 监管: business-analysis/uboreg.md
  - 业务建模:
    - BPMN 符号: business-modelling/bpmn/bpmn-symbols/bpmn_symbols.md
    - BPMN 说明: business-modelling/bpmn/bpmn_readme.md
    - 银行运营: business-modelling/bankops/bankops.md
    - 本体 - Palantir: business-modelling/ontology/palantir.md
    - 本体 - 合同管理: business-modelling/ontology/contractManagement.md
    - 本体 - 推理引擎: business-modelling/ontology/inferenceEngine.md
    - 本体 - OWL 入门: business-modelling/ontology/owlGetstarted.md
    - 本体 - ClearChoice: business-modelling/ontology/clearchoice.md
  - 项目:
    - PBOC AML 知识图谱: projects/PBOC-AML-KG/README.md
    - BOMIS 公钥更新: projects/BOMIS/PBOC-公钥的更新.md
  - 汇丰监管报告:
    - 中文报告: hsbc-regulatorty-reporting/cn/README.md
    - English Report: hsbc-regulatorty-reporting/en/README.md
  - 其他:
    - 产品经理核心: ProductManager/pmcore.md
    - 项目管理: projmgmt/projmgmt.md
    - GitHub Agent 101: agent101/github-agent101.md
    - 银行 NPDD 示例: banking/npdd-sample.md
    - 工具集: utilities/utilities_readme.md
